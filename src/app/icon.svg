<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The Buildings (Minimalist Blocks) -->
  <rect x="25" y="45" width="12" height="35" fill="url(#building-grad)" />
  <rect x="42" y="30" width="16" height="50" fill="url(#building-grad-accent)" />
  <rect x="63" y="20" width="12" height="60" fill="url(#building-grad)" />

  <!-- The Orbiting Electrical Swoosh -->
  <path d="M 10 60 C 10 95, 90 95, 90 60 C 90 25, 10 25, 10 60" stroke="url(#swoosh-grad)" stroke-width="4" stroke-linecap="round" fill="none" />
  
  <defs>
    <linearGradient id="building-grad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B5563" />
      <stop offset="1" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="building-grad-accent" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" />
      <stop offset="1" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="swoosh-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" />
      <stop offset="0.5" stop-color="#3B82F6" />
      <stop offset="1" stop-color="#1E40AF" />
    </linearGradient>
  </defs>
</svg>
